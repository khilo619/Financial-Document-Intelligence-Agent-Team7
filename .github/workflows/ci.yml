name: CI Quality Gate & Test Suite

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Code Quality & Schema Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install development & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx pydantic python-dotenv simpleeval fastapi "uvicorn[standard]" python-multipart

      - name: Run Ruff Linter (PEP 8 & Anti-Pattern Detection)
        run: |
          ruff check .

      - name: Run Ruff Formatter Verification
        run: |
          ruff format --check .

      - name: Run Automated Pytest Suite (Strict Schema Contracts)
        run: |
          pytest tests/ -v
