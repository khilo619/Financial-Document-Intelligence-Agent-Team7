# ==============================================================================
# PROJECT LEDGER: Multi-Service Orchestration Cluster
# System: Financial Document Intelligence RAG Agent (MIA Team 7)
#
# One-command startup:
#   docker compose up -d --build
# ==============================================================================

networks:
  ledger-network:
    driver: bridge
    name: ledger-network

volumes:
  qdrant_data:
    name: ledger_qdrant_data

  # Kept for backward compatibility.
  # Retrieval models are now copied directly into the Docker image.
  models:
    name: ledger_models

  huggingface_cache:
    name: ledger_huggingface_cache


services:

  # ----------------------------------------------------------------------------
  # 0. Infrastructure: Vector Database (Qdrant)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ledger-qdrant
    restart: unless-stopped

    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - ledger-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s


  # ----------------------------------------------------------------------------
  # 1. Answer Validator API (Omar - Member 4)
  # [Port 8005] Strict schema gatekeeper and deterministic arithmetic engine
  # ----------------------------------------------------------------------------
  answer-validator-api:
    image: ghcr.io/khilo619/ledger-answer-validator-api:latest
    build:
      context: .
      dockerfile: services/answer_validator_api/Dockerfile

    container_name: ledger-answer-validator-api
    restart: unless-stopped

    ports:
      - "${ANSWER_VALIDATOR_PORT:-8005}:8005"

    env_file:
      - .env

    environment:
      - ANSWER_VALIDATOR_PORT=8005

    volumes:
      - ./services/answer_validator_api/src:/app/src:ro
      - ./shared:/app/shared:ro

    networks:
      - ledger-network

    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s


  # ----------------------------------------------------------------------------
  # 2. Document Processor API (Zeina - Member 1)
  # [Port 8002] Deep-learning layout OCR, table extraction, and chunking
  # ----------------------------------------------------------------------------
  doc-processor-api:
    image: ghcr.io/khilo619/ledger-doc-processor-api:latest
    build:
      context: .
      dockerfile: services/doc_processor_api/Dockerfile

    container_name: ledger-doc-processor-api
    restart: unless-stopped

    ports:
      - "${DOC_PROCESSOR_PORT:-8002}:8002"

    env_file:
      - .env

    environment:
      - DOC_PROCESSOR_PORT=8002

    volumes:
      - ./services/doc_processor_api/src:/app/src:ro
      - ./shared:/app/shared:ro
      # Mount TAT-DQA PDFs and processed output from the host.
      - ./data/tat_dqa:/data/tat_dqa

    networks:
      - ledger-network

    # --------------------------------------------------------------------------
    # NVIDIA GPU access
    # --------------------------------------------------------------------------
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s


  # ----------------------------------------------------------------------------
  # 3. Retrieval API (Salma - Member 2)
  # [Port 8003] Hybrid dense (Qdrant) + sparse (BM25) search & cross-encoder
  # ----------------------------------------------------------------------------
  retrieval-api:
    image: ghcr.io/khilo619/ledger-retrieval-api:latest
    build:
      context: .
      dockerfile: services/retrieval_api/Dockerfile

    container_name: ledger-retrieval-api
    restart: unless-stopped

    ports:
      - "${RETRIEVAL_PORT:-8003}:8003"

    env_file:
      - .env

    environment:
      - RETRIEVAL_PORT=8003
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=ledger_documents_processed

      # ------------------------------------------------------------------------
      # Hugging Face models (loaded from persistent cache volume)
      # ------------------------------------------------------------------------
      - EMBEDDING_MODEL_NAME=BAAI/bge-large-en-v1.5
      - RERANKER_MODEL_NAME=BAAI/bge-reranker-large

    # --------------------------------------------------------------------------
    # Storage and Caches
    # --------------------------------------------------------------------------
    volumes:
      - ./services/retrieval_api/src:/app/src:ro
      - ./shared:/app/shared:ro
      # Mount Zeina's processed output so Retrieval can index it.
      - ./data/tat_dqa:/data/tat_dqa:ro
      # Persistent cache for Hugging Face models across runs
      - huggingface_cache:/root/.cache/huggingface

    # --------------------------------------------------------------------------
    # NVIDIA GPU access
    # --------------------------------------------------------------------------
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

    networks:
      - ledger-network

    depends_on:
      qdrant:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 180s


  # ----------------------------------------------------------------------------
  # 4. Agent Service (Youssef - Member 3)
  # [Port 8004] LangGraph cyclic reasoning brain & discrete calculation routing
  # ----------------------------------------------------------------------------
  agent-service:
    image: ghcr.io/khilo619/ledger-agent-service:latest
    build:
      context: .
      dockerfile: services/agent_service/Dockerfile

    container_name: ledger-agent-service
    restart: unless-stopped

    ports:
      - "${AGENT_PORT:-8004}:8004"

    env_file:
      - .env

    environment:
      - AGENT_PORT=8004
      - RETRIEVAL_HOST=retrieval-api
      - ANSWER_VALIDATOR_HOST=answer-validator-api

    volumes:
      - ./services/agent_service/src:/app/src:ro
      - ./shared:/app/shared:ro

    networks:
      - ledger-network

    depends_on:
      retrieval-api:
        condition: service_healthy

      answer-validator-api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s


  # ----------------------------------------------------------------------------
  # 5. Orchestrator API (Ahmed - Member 6 / Khaled starter)
  # [Port 8001] Central API Gateway coordinating user requests
  # ----------------------------------------------------------------------------
  orchestrator-api:
    image: ghcr.io/khilo619/ledger-orchestrator-api:latest
    build:
      context: .
      dockerfile: services/orchestrator_api/Dockerfile

    container_name: ledger-orchestrator-api
    restart: unless-stopped

    ports:
      - "${ORCHESTRATOR_PORT:-8001}:8001"

    env_file:
      - .env

    environment:
      - ORCHESTRATOR_PORT=8001
      - AGENT_HOST=agent-service
      - ANSWER_VALIDATOR_HOST=answer-validator-api
      - RETRIEVAL_HOST=retrieval-api
      - DOC_PROCESSOR_HOST=doc-processor-api

    volumes:
      - ./services/orchestrator_api/src:/app/src:ro
      - ./shared:/app/shared:ro

    networks:
      - ledger-network

    depends_on:
      agent-service:
        condition: service_healthy

      answer-validator-api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s


  # ----------------------------------------------------------------------------
  # 6. Evaluation Service (Khaled - Member 5 / Evaluation & MLOps Lead)
  # [Port 8006] Automated benchmark harness & Langfuse observability
  # ----------------------------------------------------------------------------
  eval-service:
    image: ghcr.io/khilo619/ledger-eval-service:latest
    build:
      context: .
      dockerfile: services/eval_service/Dockerfile

    container_name: ledger-eval-service
    restart: unless-stopped

    ports:
      - "${EVAL_PORT:-8006}:8006"

    env_file:
      - .env

    environment:
      - EVAL_PORT=8006
      - ORCHESTRATOR_HOST=orchestrator-api

    volumes:
      - ./services/eval_service/src:/app/src:ro
      - ./shared:/app/shared:ro

    networks:
      - ledger-network

    depends_on:
      orchestrator-api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s


  # ----------------------------------------------------------------------------
  # 7. UI Service (Ahmed - Member 6)
  # [Port 8000] Gradio User Interface (Chat + Evidence + Dashboard)
  # ----------------------------------------------------------------------------
  ui-service:
    image: ghcr.io/khilo619/ledger-ui-service:latest
    build:
      context: .
      dockerfile: services/ui_service/Dockerfile

    container_name: ledger-ui-service
    restart: unless-stopped

    ports:
      - "${UI_PORT:-8000}:8000"

    env_file:
      - .env

    environment:
      - UI_PORT=8000
      - ORCHESTRATOR_HOST=orchestrator-api

    volumes:
      - ./services/ui_service/src:/app/src:ro
      - ./shared:/app/shared:ro

    networks:
      - ledger-network

    depends_on:
      orchestrator-api:
        condition: service_healthy