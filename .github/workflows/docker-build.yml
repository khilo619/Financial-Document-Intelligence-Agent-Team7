name: Cloud Docker Build & Registry Publisher

on:
  push:
    branches: [ main, "feature/**" ]
    paths:
      - "services/**"
      - "shared/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "services/**"
      - "shared/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  filter-changes:
    name: Detect Changed Microservices
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Modified Microservice Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            doc-processor-api:
              - 'services/doc_processor_api/**'
              - 'shared/**'
              - 'docker-compose.yml'
              - '.github/workflows/docker-build.yml'
            retrieval-api:
              - 'services/retrieval_api/**'
              - 'shared/**'
              - 'docker-compose.yml'
              - '.github/workflows/docker-build.yml'
            agent-service:
              - 'services/agent_service/**'
              - 'shared/**'
              - 'docker-compose.yml'
              - '.github/workflows/docker-build.yml'
            answer-validator-api:
              - 'services/answer_validator_api/**'
              - 'shared/**'
              - 'docker-compose.yml'
              - '.github/workflows/docker-build.yml'
            orchestrator-api:
              - 'services/orchestrator_api/**'
              - 'shared/**'
              - 'docker-compose.yml'
              - '.github/workflows/docker-build.yml'
            eval-service:
              - 'services/eval_service/**'
              - 'shared/**'
              - 'docker-compose.yml'
              - '.github/workflows/docker-build.yml'
            ui-service:
              - 'services/ui_service/**'
              - 'shared/**'
              - 'docker-compose.yml'
              - '.github/workflows/docker-build.yml'

      - name: Compute Build Matrix
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          RAW_CHANGES: ${{ steps.filter.outputs.changes }}
        run: python3 .github/scripts/compute_matrix.py

  build-and-publish:
    name: Build & Publish (${{ matrix.name }})
    needs: filter-changes
    if: needs.filter-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.filter-changes.outputs.matrix) }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (High Performance Cloud Builder)
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build & Publish Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/ledger-${{ matrix.name }}:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/ledger-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
