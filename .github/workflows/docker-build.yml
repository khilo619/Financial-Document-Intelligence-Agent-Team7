name: Cloud Docker Build & Registry Publisher

on:
  push:
    branches: [ main, "feature/**" ]
    paths:
      - "services/**"
      - "shared/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "services/**"
      - "shared/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  filter-changes:
    name: Detect Changed Microservices
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Inspect Modified Microservice Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            doc-processor-api:
              - 'services/doc_processor_api/**'
              - 'shared/**'
              - 'docker-compose.yml'
              - '.github/workflows/docker-build.yml'
            retrieval-api:
              - 'services/retrieval_api/**'
              - 'shared/**'
              - 'docker-compose.yml'
              - '.github/workflows/docker-build.yml'
            agent-service:
              - 'services/agent_service/**'
              - 'shared/**'
              - 'docker-compose.yml'
              - '.github/workflows/docker-build.yml'
            answer-validator-api:
              - 'services/answer_validator_api/**'
              - 'shared/**'
              - 'docker-compose.yml'
              - '.github/workflows/docker-build.yml'
            orchestrator-api:
              - 'services/orchestrator_api/**'
              - 'shared/**'
              - 'docker-compose.yml'
              - '.github/workflows/docker-build.yml'
            eval-service:
              - 'services/eval_service/**'
              - 'shared/**'
              - 'docker-compose.yml'
              - '.github/workflows/docker-build.yml'
            ui-service:
              - 'services/ui_service/**'
              - 'shared/**'
              - 'docker-compose.yml'
              - '.github/workflows/docker-build.yml'

  build-and-publish:
    name: Build & Publish (${{ matrix.name }})
    needs: filter-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: doc-processor-api
            dockerfile: services/doc_processor_api/Dockerfile
          - name: retrieval-api
            dockerfile: services/retrieval_api/Dockerfile
          - name: agent-service
            dockerfile: services/agent_service/Dockerfile
          - name: answer-validator-api
            dockerfile: services/answer_validator_api/Dockerfile
          - name: orchestrator-api
            dockerfile: services/orchestrator_api/Dockerfile
          - name: eval-service
            dockerfile: services/eval_service/Dockerfile
          - name: ui-service
            dockerfile: services/ui_service/Dockerfile
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(needs.filter-changes.outputs.services, matrix.name)

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (High Performance Cloud Builder)
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build & Publish Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/ledger-${{ matrix.name }}:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/ledger-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
